plugins {
    id 'com.android.application'
}

android {
    namespace 'com.askclaude.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.askclaude.tv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded over ADB, never published.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/*.kotlin_module', 'META-INF/versions/**', 'META-INF/INDEX.LIST']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.anthropic:anthropic-java:3.2.0'
}
